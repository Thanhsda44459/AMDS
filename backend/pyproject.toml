[tool.ruff]
# Phiên bản Python mục tiêu (dùng để quyết định rule nào áp dụng)
target-version = "py312"

# Độ dài dòng tối đa (giống black)
line-length = 100

# Bỏ qua các thư mục không cần lint
exclude = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".git",
]

[tool.ruff.lint]
# Bật các nhóm rule cơ bản
select = [
    "E",   # pycodestyle errors (style)
    "F",   # pyflakes (lỗi logic, import thừa, biến không dùng)
    "I",   # isort (sắp xếp import)
    "B",   # flake8-bugbear (lỗi logic phổ biến)
    "UP",  # pyupgrade (gợi ý cú pháp Python mới)
]

# Tắt các rule gây nhiễu (tùy chọn)
ignore = [
    "E501",   # line too long — để formatter lo, không cần lint cảnh báo
]

[tool.ruff.format]
# Cấu hình formatter (dùng khi chạy `ruff format`)
quote-style = "double"          # dùng " thay vì '
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
# -ra để thấy lý do bỏ qua (quan trọng với integration).
# "not integration" mặc định: test tích hợp cần Mongo replica set + Redis riêng
# qua docker-compose.test.yml, không nên chạy lẫn vào lệnh unit thường ngày.
addopts = "-ra -m 'not integration'"
testpaths = ["tests"]
markers = [
    # TEST-003: cần Mongo replica set thật (transaction chỉ chạy trên replica set).
    # Chạy riêng: pytest -m integration -o addopts="-ra"
    "integration: test tích hợp với Mongo/Redis thật qua container",
]